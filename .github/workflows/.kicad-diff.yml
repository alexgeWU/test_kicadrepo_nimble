name: KiCad visual diff
on:
  pull_request:
    paths: ["**/*.kicad_pcb", "**/*.kicad_sch"]
permissions:
  contents: read
  pull-requests: write
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 } # Crucial: fetches history to compare against
        
      - uses: sksat/kicadiff@v0.2.0
        with:
          pr-comment: 'true'
          # Force visual generation and attach images to the Job Summary/PR
          upload-artifacts: 'true'
          visual-diff: 'true' 
