name: KiCad visual diff
on:
  pull_request:
    paths: ["**/*.kicad_pcb", "**/*.kicad_sch"]
permissions:
  contents: write
  pull-requests: write
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
        
      - uses: sksat/kicadiff@v0.2.0
        with:
          pr-comment: 'true'
          upload-artifact: 'true'
          image-host: 'github-pages'
          image-host-path: 'vdiff-cache'
